<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Personal WWW</title>

  <style>
    @font-face {
      font-family: "VictorSerif";
      src: url("VictorSerif-Regular.woff") format("woff");
      font-weight: 500;
      font-style: normal;
    }

    /* Full-screen fixed background (B/W) */
    body {
      margin: 0;
      padding: 0;
      width: 100vw;
      height: 100vh;
      overflow: hidden; /* prevent scrolling */
      font-family: "VictorSerif", system-ui, serif;
      position: relative;
      background: #000; /* fallback color */
    }

    /* Background image in grayscale only */
    body::before {
      content: "";
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-image: url('background.jpg'); /* your image */
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      filter: grayscale(100%); /* B/W effect */
      z-index: -1; /* behind text */
    }

    /* Left-aligned text */
    .text {
      position: absolute;
      top: 0%;
      left: 1%;
      max-width: 600px;
      font-size: 1.7rem;
      line-height: 1.4;
      color: #fdff7e; /* bright color */
      -webkit-text-stroke: 1.5px #fdff7e;
      padding: 0 1rem;
    }

    /* Responsive adjustments */
    @media (max-width: 1024px) {
      .text {
        font-size: 1.5rem;
        max-width: 80%;
      }
    }

    @media (max-width: 768px) {
      .text {
        font-size: 1.3rem;
        max-width: 90%;
        top: 5%;
        left: 5%;
      }
    }

    @media (max-width: 480px) {
      .text {
        font-size: 1.1rem;
        line-height: 1.3;
        top: 3%;
        left: 3%;
        max-width: 95%;
        -webkit-text-stroke: 1px #fdff7e; /* thinner stroke on small screens */
      }
    }
  </style>
</head>

<body>
  <div class="text">
    <p>
      Berlin based Graphic- und Information Designer with a focus on geospatial, visual narratives.
      Currently working as part of the Data Journalism Department at Deutsche Welle.
    </p>
  </div>
</body>
</html>
