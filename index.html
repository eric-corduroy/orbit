<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Personal WWW</title>

  <style>
    @font-face {
      font-family: "VictorSerif";
      src: url("VictorSerif-Regular.woff") format("woff");
      font-weight: 500;
      font-style: normal;
    }

    /* Full-screen fixed background (B/W) */
    body {
      margin: 0;
      padding: 0;
      width: 100vw;
      height: 100vh;
      overflow: hidden; /* prevent scrolling */
      font-family: "VictorSerif", system-ui, serif;
      position: relative;
      background: #000; /* fallback color */
    }

    /* Background image in grayscale only */
    body::before {
      content: "";
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-image: url('background.jpg'); /* your image */
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      filter: grayscale(100%); /* B/W effect */
      opacity: 75%;
      z-index: -1; /* behind text */
    }

    /* Left-aligned text */
    .text {
      position: absolute;
      top: 0%;
      left: 1%;
      max-width: 600px;
      font-size: 1.7rem;
      line-height: 1.4;
      color: #9aff7e; /* bright color */
      -webkit-text-stroke: 1.5px #9aff7e;
      padding: 0 1rem;
    }

       /* Email link styling */
    .text a {
      color: #ffffff;
         -webkit-text-stroke: 1.5px #ffffff;
      text-decoration: none;
    }

    /* Responsive adjustments */
    @media (max-width: 1024px) {
      .text {
        top: -2%;
      left: 1%;
        font-size: 5.3rem;
        line-height: 1.1;
        color: #9aff7e; /* bright color */
        -webkit-text-stroke: 4px #9aff7e;
        max-width: 95%;
      }
    }

    @media (max-width: 768px) {
        .text {
           top: -10%;
      left: 1%;
        font-size: 5.3rem;
        line-height: 1.1;
        -webkit-text-stroke: 6.5px #fdff7e;
        max-width: 90%;
      }
    }

    @media (max-width: 480px) {
       .text {
         top: 0%;
      left: 1%;
        font-size: 5.3rem;
        line-height: 1.1;
        -webkit-text-stroke: 6.5px #fdff7e;
        max-width: 90%;
      }
    }
  </style>
</head>

<body>
  <div class="text">
    <p>
      Berlin based Graphic- and Information Designer with a focus on geospatial, visual narratives.
      Currently working as part of the Data Journalism Department at Deutsche Welle
    </p>
    <p>
  Reach me <a href="mailto:mail@julianpeschel.info">here</a>
</p>
  </div>
</body>
</html>
